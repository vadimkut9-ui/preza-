<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Раскраска по номерам - Дроби</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            background-color: #f0f0f0;
            padding: 20px;
            flex-wrap: wrap;
        }
        canvas {
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            cursor: crosshair;
            max-width: 100%;
        }
        .palette {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            height: fit-content;
            max-height: 90vh;
            overflow-y: auto;
        }
        .palette h3 {
            margin: 0 0 10px 0;
            text-align: center;
            font-size: 18px;
        }
        .color-swatch {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #ccc;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #333;
            transition: transform 0.1s;
        }
        .color-swatch:hover {
            transform: scale(1.1);
            border-color: #000;
        }
        .color-swatch.selected {
            border: 3px solid #000;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transform: scale(1.1);
        }
        .color-swatch span {
            font-size: 10px;
            pointer-events: none;
        }
        /* Стили для кнопок */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <!-- Холст для рисования -->
    <canvas id="raskraskaCanvas"></canvas>

    <!-- Панель с палитрой -->
    <div class="palette">
        <h3>Выберите цвет</h3>
        <div id="colorContainer"></div>
        
        <div class="controls">
            <button onclick="resetCanvas()">Сбросить</button>
        </div>
    </div>

    <script>
        // --- НАСТРОЙКИ ЦВЕТОВ ---
        // Здесь мы задаем цвета, которые используем для заливки.
        // HEX-коды взяты примерно из вашей картинки.
        // ВАЖНО: Чтобы это работало, на картинке не должно быть сильных артефактов сжатия (JPEG).
        const paletteColors = [
            { hex: "#FF69B4", name: "Розовый" },    // 1. 2 1/3 + 4 5/6
            { hex: "#FF0000", name: "Красный" },    // 2. 7/12 + 5/12
            { hex: "#FF8C00", name: "Оранжевый" },  // 3. 6 3/8 - 1 1/8
            { hex: "#FFD700", name: "Желтый" },     // 4. 9 - 2/3
            { hex: "#32CD32", name: "Зеленый" },    // 5. 5 7/9 - 2 4/9
            { hex: "#00BFFF", name: "Голубой" },    // 6. 12/15 + 3/5
            { hex: "#0000FF", name: "Синий" },      // 7. 3 1/4 + 2 3/4
            { hex: "#800080", name: "Фиолетовый" }, // 8. 8 - 5/6
            { hex: "#8B4513", name: "Коричневый" }, // 9. 4 7/12 - 1 5/12
            { hex: "#C0C0C0", name: "Серый" },      // 10. 9/10 + 1/5
            { hex: "#000000", name: "Черный" }      // 11. 7 - 3 2/7
        ];

        // --- ЭЛЕМЕНТЫ СТРАНИЦЫ ---
        const canvas = document.getElementById('raskraskaCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const colorContainer = document.getElementById('colorContainer');

        let selectedColor = null;
        let imageLoaded = false;

        // --- ИНИЦИАЛИЗАЦИЯ ПАЛИТРЫ ---
        paletteColors.forEach((color, index) => {
            const swatch = document.createElement('div');
            swatch.className = 'color-swatch';
            swatch.style.backgroundColor = color.hex;
            swatch.title = color.name;
            
            // Добавляем номер для удобства (опционально)
            // swatch.innerHTML = `<span>${index + 1}</span>`;

            swatch.onclick = () => {
                document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('selected'));
                swatch.classList.add('selected');
                selectedColor = color.hex;
            };
            colorContainer.appendChild(swatch);
        });

        // --- ЗАГРУЗКА ИЗОБРАЖЕНИЯ ---
        const img = new Image();
        // ВНИМАНИЕ: Замените 'raskraska.png' на путь к вашему файлу, если он называется иначе
        img.src = 'raskraska.png'; 

        img.onload = () => {
            // Устанавливаем размер холста под размер картинки
            canvas.width = img.width;
            canvas.height = img.height;
            
            // Рисуем картинку на холсте
            ctx.drawImage(img, 0, 0);
            imageLoaded = true;
        };

        img.onerror = () => {
            alert("Ошибка: Не удалось загрузить изображение. Убедитесь, что файл 'raskraska.png' находится в той же папке, что и HTML файл.");
        };

        // --- ЛОГИКА РАСКРАШИВАНИЯ ---
        canvas.addEventListener('click', (e) => {
            if (!imageLoaded || !selectedColor) {
                if(!selectedColor) alert("Сначала выберите цвет в палитре!");
                return;
            }

            const rect = canvas.getBoundingClientRect();
            // Вычисляем координаты клика относительно реального размера картинки
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            // Получаем цвет пикселя, по которому кликнули
            const pixel = ctx.getImageData(x, y, 1, 1).data;
            const r = pixel[0];
            const g = pixel[1];
            const b = pixel[2];
            const a = pixel[3];

            // Если кликнули по прозрачному месту (вне рисунка) - игнорируем
            if (a < 50) return;

            // Проверяем, является ли этот пиксель "мишенью" для выбранного цвета
            // Находим объект цвета в палитре, который соответствует выбранному
            const targetColor = paletteColors.find(c => c.hex === selectedColor);
            
            if (targetColor) {
                if (isColorMatch(r, g, b, targetColor.hex)) {
                    floodFill(x, y, hexToRgb(selectedColor));
                } else {
                    console.log("Не тот цвет. Кликнули по RGB:", r, g, b);
                }
            }
        });

        // Функция сравнения цветов (допускает небольшую погрешность из-за сжатия картинки)
        function isColorMatch(r, g, b, hex) {
            const target = hexToRgb(hex);
            const tolerance = 50; // Допустимая разница в цвете (0-255)

            return Math.abs(r - target.r) < tolerance &&
                   Math.abs(g - target.g) < tolerance &&
                   Math.abs(b - target.b) < tolerance;
        }

        // Вспомогательная функция: HEX -> RGB
        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        // --- АЛГОРИТМ ЗАЛИВКИ (Flood Fill) ---
        function floodFill(startX, startY, fillColor) {
            const width = canvas.width;
            const height = canvas.height;
            
            // Получаем данные изображения
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            // Получаем цвет начального пикселя
            const startPos = (startY * width + startX) * 4;
            const startR = data[startPos];
            const startG = data[startPos + 1];
            const startB = data[startPos + 2];

            // Если цвет заливки совпадает с текущим - ничего не делаем
            if (startR === fillColor.r && startG === fillColor.g && startB === fillColor.b) return;

            const stack = [[startX, startY]];
            const tolerance = 60; // Допуск для определения границ (чтобы не залить черные линии)

            while (stack.length > 0) {
                const [x, y] = stack.pop();
                const pos = (y * width + x) * 4;

                // Проверка границ
                if (x < 0 || x >= width || y < 0 || y >= height) continue;

                const r = data[pos];
                const g = data[pos + 1];
                const b = data[pos + 2];

                // Проверяем, похож ли текущий пиксель на стартовый (в пределах допуска)
                if (Math.abs(r - startR) <= tolerance &&
                    Math.abs(g - startG) <= tolerance &&
                    Math.abs(b - startB) <= tolerance) {

                    // Закрашиваем
                    data[pos] = fillColor.r;
                    data[pos + 1] = fillColor.g;
                    data[pos + 2] = fillColor.b;
                    data[pos + 3] = 255; // Непрозрачность

                    // Добавляем соседей в стек
                    stack.push([x + 1, y]);
                    stack.push([x - 1, y]);
                    stack.push([x, y + 1]);
                    stack.push([x, y - 1]);
                }
            }

            // Применяем изменения
            ctx.putImageData(imageData, 0, 0);
        }

        // --- СБРОС ---
        function resetCanvas() {
            if (imageLoaded) {
                ctx.drawImage(img, 0, 0);
            }
        }
    </script>
</body>
</html>
