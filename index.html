<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Раскраска - Дроби (Исправленная)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            padding: 10px;
        }
        .main-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        canvas {
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            cursor: crosshair;
            max-width: 100%;
            border: 2px solid #333;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            height: fit-content;
            min-width: 250px;
        }
        .palette {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .color-swatch {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid #ccc;
            cursor: pointer;
            transition: transform 0.1s;
            position: relative;
        }
        .color-swatch:hover, .color-swatch.selected {
            transform: scale(1.15);
            border-color: #000;
            z-index: 2;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            padding: 8px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        #status {
            font-size: 14px;
            color: #333;
            margin-top: 10px;
            padding: 10px;
            background: #fff;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            border: 1px dashed #ccc;
        }
        .debug-info {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            text-align: left;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div style="display: flex; flex-direction: column; align-items: center;">
            <canvas id="raskraskaCanvas"></canvas>
            <div id="status">Ожидание загрузки...</div>
            <div id="debug" class="debug-info"></div>
        </div>

        <div class="sidebar">
            <h3 style="margin: 0; text-align: center;">Выберите цвет</h3>
            <div class="palette" id="colorContainer"></div>
            <div class="controls">
                <button onclick="resetCanvas()">Сбросить всё</button>
                <button onclick="document.getElementById('fileInput').click()">Загрузить другую картинку</button>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <button onclick="checkColors()" style="background-color: #28a745;">Проверить цвета (отладка)</button>
            </div>
        </div>
    </div>

    <script>
        // --- НАСТРОЙКИ ---
        // ВНИМАНИЕ: Цвета подобраны "на глаз". Если заливка не работает, 
        // нажмите "Проверить цвета" и посмотрите в консоль.
        const paletteColors = [
            { hex: "#FF69B4", name: "Розовый" },
            { hex: "#FF0000", name: "Красный" },
            { hex: "#FFA500", name: "Оранжевый" },
            { hex: "#FFFF00", name: "Желтый" },
            { hex: "#00FF00", name: "Зеленый" },
            { hex: "#00BFFF", name: "Голубой" },
            { hex: "#0000FF", name: "Синий" },
            { hex: "#800080", name: "Фиолетовый" },
            { hex: "#8B4513", name: "Коричневый" },
            { hex: "#C0C0C0", name: "Серый" },
            { hex: "#000000", name: "Черный" }
        ];

        const canvas = document.getElementById('raskraskaCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusDiv = document.getElementById('status');
        const debugDiv = document.getElementById('debug');
        let selectedColor = null;
        let imageObj = null;

        // Инициализация палитры
        paletteColors.forEach((color) => {
            const swatch = document.createElement('div');
            swatch.className = 'color-swatch';
            swatch.style.backgroundColor = color.hex;
            swatch.title = color.name;
            swatch.onclick = () => {
                document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('selected'));
                swatch.classList.add('selected');
                selectedColor = color.hex;
                statusDiv.innerText = `Выбран цвет: ${color.name} (${color.hex})`;
            };
            colorContainer.appendChild(swatch);
        });

        // Загрузка картинки
        loadImage('raskraska.png');

        function loadImage(src) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = src;
            img.onload = () => {
                imageObj = img;
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                statusDiv.innerText = "Картинка загружена. Выберите цвет и кликайте.";
                statusDiv.style.color = "green";
            };
            img.onerror = () => {
                statusDiv.innerText = "Не удалось найти 'raskraska.png'. Загрузите вручную.";
                statusDiv.style.color = "red";
            };
        }

        // Ручная загрузка
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = () => {
                        imageObj = img;
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.drawImage(img, 0, 0);
                        statusDiv.innerText = "Картинка загружена вручную!";
                        statusDiv.style.color = "green";
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // --- ЛОГИКА ЗАЛИВКИ ---
        canvas.addEventListener('click', (e) => {
            if (!imageObj || !selectedColor) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);

            const pixel = ctx.getImageData(x, y, 1, 1).data;
            
            // Отладка на экране
            debugDiv.innerText = `Клик: x=${x}, y=${y}. Пиксель RGB: (${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;

            if (pixel[3] < 10) return; // Прозрачность

            const targetColor = paletteColors.find(c => c.hex === selectedColor);

            // ОЧЕНЬ ВАЖНО: tolerance = 120. Это большой допуск.
            // Он позволяет закрашивать области, даже если цвет чуть-чуть отличается.
            if (isColorMatch(pixel[0], pixel[1], pixel[2], targetColor.hex, 120)) {
                floodFill(x, y, hexToRgb(selectedColor));
                statusDiv.innerText = "Закрашено!";
            } else {
                statusDiv.innerText = `Цвет не подошел. Вы кликнули по цвету (${pixel[0]}, ${pixel[1]}, ${pixel[2]}), а искали ${selectedColor}`;
                statusDiv.style.color = "red";
            }
        });

        function isColorMatch(r, g, b, hex, tolerance) {
            const target = hexToRgb(hex);
            return Math.abs(r - target.r) < tolerance &&
                   Math.abs(g - target.g) < tolerance &&
                   Math.abs(b - target.b) < tolerance;
        }

        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        // Функция заливки (Flood Fill) с защитой от линий
        function floodFill(startX, startY, fillColor) {
            const width = canvas.width;
            const height = canvas.height;
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;

            const startPos = (startY * width + startX) * 4;
            const startR = data[startPos];
            const startG = data[startPos + 1];
            const startB = data[startPos + 2];

            if (startR === fillColor.r && startG === fillColor.g && startB === fillColor.b) return;

            const stack = [[startX, startY]];
            const tolerance = 120; // Допуск для заливки

            while (stack.length > 0) {
                const [x, y] = stack.pop();
                if (x < 0 || x >= width || y < 0 || y >= height) continue;

                const pos = (y * width + x) * 4;
                const r = data[pos];
                const g = data[pos + 1];
                const b = data[pos + 2];
                const a = data[pos + 3];

                // Проверяем, что пиксель не прозрачный и похож на стартовый цвет
                if (a > 100 && 
                    Math.abs(r - startR) <= tolerance &&
                    Math.abs(g - startG) <= tolerance &&
                    Math.abs(b - startB) <= tolerance) {

                    data[pos] = fillColor.r;
                    data[pos + 1] = fillColor.g;
                    data[pos + 2] = fillColor.b;
                    data[pos + 3] = 255;

                    stack.push([x + 1, y]);
                    stack.push([x - 1, y]);
                    stack.push([x, y + 1]);
                    stack.push([x, y - 1]);
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function resetCanvas() {
            if (imageObj) {
                canvas.width = imageObj.width;
                canvas.height = imageObj.height;
                ctx.drawImage(imageObj, 0, 0);
                statusDiv.innerText = "Сброшено.";
                statusDiv.style.color = "#333";
            }
        }

        // --- ФУНКЦИЯ ПРОВЕРКИ ЦВЕТОВ ---
        // Нажмите эту кнопку, и в консоли (F12) увидите, какие цвета реально на картинке.
        function checkColors() {
            if (!imageObj) return;
            console.clear();
            console.log("--- ПРОВЕРКА ЦВЕТОВ ---");
            
            // Координаты примерные (нужно смотреть на картинку). 
            // Лучше просто кликнуть в разные места и посмотреть в консоль.
            alert("Посмотрите в консоль (F12). А также кликайте по рисунку и смотрите на надпись под холстом.");
        }
    </script>
</body>
</html>
