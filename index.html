<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Идеальная раскраска</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            background-color: #eef2f5;
            padding: 20px;
            flex-wrap: wrap;
            margin: 0;
        }
        
        /* Контейнер для картинки и SVG-слоя */
        .canvas-wrapper {
            position: relative;
            background-color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
            max-width: 100%;
        }

        /* Сама картинка (служит фоном) */
        #bg-image {
            display: block;
            max-width: 100%;
            height: auto;
            pointer-events: none; /* Картинка не перехватывает клики */
        }

        /* SVG слой поверх картинки */
        #svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* Стили для зон раскраски */
        .color-zone {
            fill: transparent; /* Изначально прозрачные */
            stroke: transparent;
            stroke-width: 2;
            transition: fill 0.2s ease;
        }
        
        /* При наведении подсвечиваем зону */
        .color-zone:hover {
            fill: rgba(200, 200, 200, 0.3); 
        }

        /* Боковая панель */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 260px;
        }

        h3 {
            margin: 0;
            text-align: center;
            color: #333;
            font-size: 18px;
        }

        .palette {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .color-swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 3px solid #ddd;
            cursor: pointer;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .color-swatch:hover {
            transform: scale(1.1);
        }

        .color-swatch.selected {
            border-color: #333;
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        #status {
            text-align: center;
            font-size: 14px;
            color: #555;
            min-height: 40px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px dashed #ccc;
        }

        .error { color: #d9534f; font-weight: bold; }
        .success { color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

    <div class="canvas-wrapper">
        <!-- Картинка-фон -->
        <img id="bg-image" src="raskraska.png" alt="Раскраска Дроби">
        
        <!-- Слой с невидимыми зонами (SVG) -->
        <svg id="svg-layer" viewBox="0 0 1200 950" preserveAspectRatio="xMidYMid meet">
            <!-- Левая сторона (Цифра 5) -->
            <polygon class="color-zone" id="pink" data-color="#FF69B4" points="150,200 350,100 450,200 400,280 250,300" />
            <polygon class="color-zone" id="red" data-color="#FF0000" points="50,320 150,250 200,350 150,420 50,400" />
            <polygon class="color-zone" id="yellow" data-color="#FFD700" points="400,300 480,350 450,450 350,420 300,350" />
            <polygon class="color-zone" id="orange" data-color="#FF8C00" points="50,500 150,450 200,550 150,650 50,600" />
            <polygon class="color-zone" id="blue" data-color="#00BFFF" points="350,480 450,480 450,580 350,600 280,540" />
            <polygon class="color-zone" id="green" data-color="#32CD32" points="100,700 250,650 300,750 200,820 80,780" />
            <polygon class="color-zone" id="gray" data-color="#C0C0C0" points="300,700 450,650 480,750 400,800 320,780" />

            <!-- Правая сторона (Цифра 7) -->
            <polygon class="color-zone" id="darkblue" data-color="#0000FF" points="550,200 700,150 800,200 750,300 600,320" />
            <polygon class="color-zone" id="purple" data-color="#800080" points="800,200 950,150 950,300 800,320" />
            <polygon class="color-zone" id="brown" data-color="#8B4513" points="700,380 900,320 950,450 750,500" />
            <polygon class="color-zone" id="black" data-color="#000000" points="650,550 850,500 850,650 700,700" />
            <polygon class="color-zone" id="pink2" data-color="#FF69B4" points="600,750 800,700 850,850 650,900" />
            
            <!-- Руки -->
            <polygon class="color-zone" id="brown-hand" data-color="#8B4513" points="50,850 350,850 350,950 50,950" />
            <polygon class="color-zone" id="brown-hand2" data-color="#8B4513" points="550,850 850,850 850,950 550,950" />
        </svg>
    </div>

    <div class="sidebar">
        <h3>Выберите цвет</h3>
        <div class="palette" id="colorContainer"></div>
        <div id="status">Кликайте по областям!</div>
        <button onclick="resetCanvas()">Сбросить раскраску</button>
    </div>

    <script>
        // --- ЦВЕТА (Строго по картинке) ---
        const palette = [
            { hex: "#FF69B4", name: "Розовый" },
            { hex: "#FF0000", name: "Красный" },
            { hex: "#FF8C00", name: "Оранжевый" },
            { hex: "#FFD700", name: "Желтый" },
            { hex: "#32CD32", name: "Зеленый" },
            { hex: "#00BFFF", name: "Голубой" },
            { hex: "#0000FF", name: "Синий" },
            { hex: "#800080", name: "Фиолетовый" },
            { hex: "#8B4513", name: "Коричневый" },
            { hex: "#C0C0C0", name: "Серый" },
            { hex: "#000000", name: "Черный" }
        ];

        const colorContainer = document.getElementById('colorContainer');
        const statusDiv = document.getElementById('status');
        const zones = document.querySelectorAll('.color-zone');
        let selectedColor = null;

        // 1. Создаем палитру
        palette.forEach(color => {
            const swatch = document.createElement('div');
            swatch.className = 'color-swatch';
            swatch.style.backgroundColor = color.hex;
            swatch.title = color.name;
            
            swatch.onclick = () => {
                // Снимаем выделение со всех
                document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('selected'));
                // Выделяем текущий
                swatch.classList.add('selected');
                selectedColor = color;
                
                statusDiv.innerText = `Выбран: ${color.name}`;
                statusDiv.className = "";
            };
            colorContainer.appendChild(swatch);
        });

        // 2. Логика раскрашивания
        zones.forEach(zone => {
            zone.addEventListener('click', (e) => {
                if (!selectedColor) {
                    statusDiv.innerText = "Сначала выберите цвет в палитре!";
                    statusDiv.className = "error";
                    return;
                }

                // Получаем правильный цвет для этой зоны (из data-атрибута)
                const correctColorHex = zone.getAttribute('data-color');

                // Проверяем, совпадает ли выбранный цвет с правильным
                if (selectedColor.hex.toUpperCase() === correctColorHex.toUpperCase()) {
                    // Верно! Закрашиваем
                    zone.style.fill = selectedColor.hex;
                    zone.style.fillOpacity = "0.85"; // Немного прозрачности, чтобы текстура бумаги/линии были видны
                    statusDiv.innerText = "Верно!";
                    statusDiv.className = "success";
                } else {
                    // Неверно
                    statusDiv.innerText = "Этот пример решается другим цветом!";
                    statusDiv.className = "error";
                    
                    // Визуально показываем ошибку (трясем зону)
                    zone.style.fill = "#ffcccc";
                    setTimeout(() => {
                        if(!zone.style.fill || zone.style.fill === "#ffcccc") {
                             zone.style.fill = "transparent";
                        }
                    }, 300);
                }
            });
        });

        // 3. Сброс
        function resetCanvas() {
            zones.forEach(zone => {
                zone.style.fill = "transparent";
            });
            statusDiv.innerText = "Сброшено!";
            statusDiv.className = "";
        }
    </script>
</body>
</html>
