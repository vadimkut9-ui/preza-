<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Раскраска по примерам</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            background-color: #f4f4f4;
            padding: 20px;
            flex-wrap: wrap;
        }
        canvas {
            background-color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            cursor: pointer;
            border-radius: 8px;
            max-width: 100%;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            width: 280px;
        }
        h3 {
            margin: 0;
            text-align: center;
            color: #333;
        }
        .palette {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .color-swatch {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 3px solid #ddd;
            cursor: pointer;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .color-swatch:hover {
            transform: scale(1.1);
        }
        .color-swatch.selected {
            border-color: #333;
            transform: scale(1.1);
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            text-align: center;
            font-size: 14px;
            color: #555;
            min-height: 40px;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <canvas id="raskraskaCanvas"></canvas>

    <div class="sidebar">
        <h3>Выберите цвет</h3>
        <div class="palette" id="colorContainer"></div>
        <div id="status">Загрузка картинки...</div>
        <button onclick="resetCanvas()">Сбросить всё</button>
        <button onclick="document.getElementById('fileInput').click()" style="background-color: #28a745;">Загрузить картинку</button>
        <input type="file" id="fileInput" accept="image/*" style="display: none;">
    </div>

    <script>
        // --- СПИСОК ЦВЕТОВ (Строго по вашему изображению) ---
        const palette = [
            { hex: "#FF69B4", id: "pink" },   // Розовый
            { hex: "#FF0000", id: "red" },    // Красный
            { hex: "#FF8C00", id: "orange" }, // Оранжевый
            { hex: "#FFD700", id: "yellow" }, // Желтый
            { hex: "#32CD32", id: "green" },  // Зеленый
            { hex: "#00BFFF", id: "blue" },   // Голубой
            { hex: "#0000FF", id: "darkblue" },// Синий
            { hex: "#800080", id: "purple" }, // Фиолетовый
            { hex: "#8B4513", id: "brown" },  // Коричневый
            { hex: "#C0C0C0", id: "gray" },   // Серый
            { hex: "#000000", id: "black" }   // Черный
        ];

        const canvas = document.getElementById('raskraskaCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusDiv = document.getElementById('status');
        const colorContainer = document.getElementById('colorContainer');
        
        let selectedColor = null;
        let imageLoaded = false;
        let img = new Image();

        // --- ЗАДАЕМ ОБЛАСТИ (Координаты X, Y, Радиус) ---
        // ВНИМАНИЕ: Координаты приблизительные, основаны на пропорциях вашей картинки.
        // Если область закрашивается криво, эти цифры можно подкорректировать.
        const areas = [
            // Левая сторона (Цифра 5 и внутренние круги)
            { id: "pink",   x: 280, y: 180, r: 60 },  // Верхняя дуга (2 1/3 + 4 5/6)
            { id: "red",    x: 180, y: 320, r: 50 },  // Левая верхняя (7/12 + 5/12)
            { id: "yellow", x: 320, y: 360, r: 50 },  // Внутренняя дуга (9 - 2/3)
            { id: "orange", x: 180, y: 520, r: 50 },  // Левая середина (6 3/8 - 1 1/8)
            { id: "blue",   x: 320, y: 520, r: 50 },  // Внутренний круг (12/15 + 3/5)
            { id: "green",  x: 200, y: 700, r: 60 },  // Левая нижняя (5 7/9 - 2 4/9)
            { id: "gray",   x: 350, y: 720, r: 50 },  // Правая нижняя (11/14 + 2/7)
            
            // Правая сторона (Цифра 7)
            { id: "darkblue", x: 600, y: 220, r: 70 }, // Верхняя часть (3 1/4 + 2 3/4)
            { id: "purple",   x: 830, y: 220, r: 60 }, // Верхний правый угол (8 - 5/6)
            { id: "brown",    x: 730, y: 400, r: 50 }, // Средняя часть (4 7/12 - 1 5/12)
            { id: "black",    x: 700, y: 550, r: 50 }, // Нижняя средняя (9/10 + 1/5)
            { id: "pink",     x: 700, y: 750, r: 60 }, // Самая нижняя (7 - 3 2/7) - Внимание: цвет розовый, но пример другой!
            
            // Руки (опционально)
            { id: "brown", x: 200, y: 900, r: 80 },
            { id: "brown", x: 700, y: 900, r: 80 }
        ];

        // --- ИНИЦИАЛИЗАЦИЯ ПАЛИТРЫ ---
        palette.forEach(color => {
            const swatch = document.createElement('div');
            swatch.className = 'color-swatch';
            swatch.style.backgroundColor = color.hex;
            swatch.onclick = () => {
                document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('selected'));
                swatch.classList.add('selected');
                selectedColor = color;
                statusDiv.innerText = "Цвет выбран. Кликайте по рисунку.";
                statusDiv.className = "";
            };
            colorContainer.appendChild(swatch);
        });

        // --- ЗАГРУЗКА КАРТИНКИ ---
        img.src = 'raskraska.png';
        img.crossOrigin = "Anonymous";
        
        img.onload = () => {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            imageLoaded = true;
            statusDiv.innerText = "Готово! Выберите цвет и кликайте.";
            statusDiv.style.color = "green";
        };

        img.onerror = () => {
            statusDiv.innerText = "Ошибка: Не найден файл raskraska.png. Нажмите 'Загрузить картинку'.";
            statusDiv.className = "error";
        };

        // Ручная загрузка
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // --- ЛОГИКА КЛИКА ---
        canvas.addEventListener('click', (e) => {
            if (!imageLoaded) return;
            if (!selectedColor) {
                statusDiv.innerText = "Сначала выберите цвет в палитре!";
                statusDiv.className = "error";
                return;
            }

            // Получаем координаты клика относительно реального размера картинки
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            let areaFound = false;

            // Проверяем все заданные области
            for (let area of areas) {
                // Вычисляем расстояние от клика до центра области
                const dist = Math.sqrt(Math.pow(clickX - area.x, 2) + Math.pow(clickY - area.y, 2));

                if (dist < area.r) {
                    // Если попали в область
                    if (area.id === selectedColor.id) {
                        // Цвет совпал! Закрашиваем.
                        fillArea(area, selectedColor.hex);
                        statusDiv.innerText = "Верно! Область закрашена.";
                        statusDiv.className = "";
                        areaFound = true;
                        break;
                    } else {
                        // Попали в область, но цвет не тот
                        statusDiv.innerText = "Этот пример решается другим цветом!";
                        statusDiv.className = "error";
                        areaFound = true; // Нашли область, но не ту
                        break;
                    }
                }
            }

            if (!areaFound) {
                statusDiv.innerText = "Клик мимо области. Попробуйте попасть в центр примера.";
                statusDiv.className = "error";
            }
        });

        // --- ФУНКЦИЯ ЗАКРАШИВАНИЯ ---
        function fillArea(area, colorHex) {
            // Используем глобальный композитный режим, чтобы закрасить только белые пиксели
            // (чтобы черные линии и текст остались видны)
            
            // Создаем временный canvas для заливки
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tempCtx = tempCanvas.getContext('2d');

            // Рисуем круг нужного цвета
            tempCtx.fillStyle = colorHex;
            tempCtx.beginPath();
            tempCtx.arc(area.x, area.y, area.r, 0, Math.PI * 2);
            tempCtx.fill();

            // Накладываем этот круг на основной холст, но только в тех местах, где есть пиксели
            // (source-atop сохраняет черные линии)
            ctx.save();
            ctx.globalCompositeOperation = 'source-atop';
            
            // Рисуем картинку поверх, чтобы обновить маску (опционально)
            // Но проще просто закрасить:
            ctx.drawImage(tempCanvas, 0, 0);
            
            ctx.restore();
            
            // Перерисовываем контуры поверх, чтобы они не закрасились (если нужно)
            // В данном случае мы используем source-atop, который не закрашивает прозрачность, 
            // но черные линии уже есть на холсте.
        }

        // --- СБРОС ---
        function resetCanvas() {
            if (imageLoaded) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                statusDiv.innerText = "Сброшено. Начните заново!";
                statusDiv.style.color = "#555";
            }
        }
    </script>
</body>
</html>
